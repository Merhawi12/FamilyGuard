name: CI

# `restructure/three-apps-aws` is named alongside main deliberately, and it is
# not a convenience.
#
# `main` is the pre-restructure tree from June: one app, no GCP, and the
# plaintext-password era. Everything since — the three-app split, the cloud
# migration, every security fix, and what production actually runs — lives on
# that branch, 73 commits ahead and never merged. With triggers on `main` alone,
# none of the six jobs below had ever run against a single line of it: the whole
# shipped product was gated by nothing but somebody remembering to run the suites
# on their laptop.
#
# `pull_request: [main]` does cover a PR opened from it, but that is the wrong
# moment. The work is deployed from this branch continuously and merged rarely,
# so the check has to happen on the push that ships, not on a merge that may be
# months away.
#
# Remove the branch from these lists once it has been merged and retired.
on:
  push:
    branches: [main, restructure/three-apps-aws]
  pull_request:
    branches: [main, restructure/three-apps-aws]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      # Boots a real server and walks the full parent/child workflow over HTTP
      # and Socket.IO, which the in-process suite cannot cover.
      - run: npm run test:e2e

  # The suite above runs on in-memory SQLite, which is fast and needs no
  # services but is not the engine production uses. The two disagree silently:
  # a `json` column has no equality operator in Postgres and is plain text in
  # SQLite, and Postgres resolves operators when it parses a statement, so an
  # incompatibility fails even against an empty table. Since the API migrates
  # itself at boot, that class of bug does not surface as a failing test — it
  # surfaces as a Cloud Run revision that never becomes healthy.
  api-postgres:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parentix_test
          POSTGRES_USER: parentix
          POSTGRES_PASSWORD: parentix_ci
        ports:
          - 5432:5432
        # Without this the job races the container: the port is published before
        # Postgres is ready to accept connections.
        options: >-
          --health-cmd "pg_isready -U parentix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://parentix:parentix_ci@127.0.0.1:5432/parentix_test
      E2E_DATABASE_URL: postgresql://parentix:parentix_ci@127.0.0.1:5432/parentix_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run test:pg
      - run: npm run test:e2e

  web:
    name: Web builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # One install at the workspace root covers the shared package and both apps.
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Firebase Hosting resolves a static file before any rewrite, so an
      # index.html in the Family App's output would be served at `/` and the
      # rewrite to the marketing page would never run. The bug is invisible in a
      # build log and lands on the most visible URL on the site, so it is checked
      # rather than trusted. apps/family-app/vite.config.js does the rename.
      - name: Family App output is laid out for Firebase Hosting
        run: |
          dist=apps/family-app/dist
          test -f "$dist/app.html"      || { echo "::error::$dist/app.html missing — SPA shell was not renamed"; exit 1; }
          test ! -f "$dist/index.html"  || { echo "::error::$dist/index.html exists — it would win over the / rewrite"; exit 1; }
          test -f "$dist/landing.html"  || { echo "::error::$dist/landing.html missing — / would fall through to the SPA"; exit 1; }
          test -f apps/admin-dashboard/dist/index.html || { echo "::error::admin dist has no index.html"; exit 1; }

  # A green build says the bundles compiled, not that a page renders. This is
  # the only job that runs the front ends: it serves both `dist/` folders behind
  # a proxy reproducing Firebase Hosting's static-then-rewrite resolution, then
  # drives Chromium through sign-in, every dashboard and console route, and the
  # console's own RBAC, failing on any console error, page exception or 4xx
  # along the way.
  browser:
    name: Web runtime (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The harness boots the real API, so its dependencies are needed too.
      - run: npm ci --prefix services/api
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser

  infrastructure:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      # -backend=false: validation needs the provider schemas, not the remote
      # state, so this runs without any Google Cloud credentials.
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
