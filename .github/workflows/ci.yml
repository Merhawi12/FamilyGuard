name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      # Boots a real server and walks the full parent/child workflow over HTTP
      # and Socket.IO, which the in-process suite cannot cover.
      - run: npm run test:e2e

  # The suite above runs on in-memory SQLite, which is fast and needs no
  # services but is not the engine production uses. The two disagree silently:
  # a `json` column has no equality operator in Postgres and is plain text in
  # SQLite, and Postgres resolves operators when it parses a statement, so an
  # incompatibility fails even against an empty table. Since the API migrates
  # itself at boot, that class of bug does not surface as a failing test — it
  # surfaces as a Cloud Run revision that never becomes healthy.
  api-postgres:
    name: API tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parentix_test
          POSTGRES_USER: parentix
          POSTGRES_PASSWORD: parentix_ci
        ports:
          - 5432:5432
        # Without this the job races the container: the port is published before
        # Postgres is ready to accept connections.
        options: >-
          --health-cmd "pg_isready -U parentix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://parentix:parentix_ci@127.0.0.1:5432/parentix_test
      E2E_DATABASE_URL: postgresql://parentix:parentix_ci@127.0.0.1:5432/parentix_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run test:pg
      - run: npm run test:e2e

  web:
    name: Web builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # One install at the workspace root covers the shared package and both apps.
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infrastructure:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      # -backend=false: validation needs the provider schemas, not the remote
      # state, so this runs without any Google Cloud credentials.
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
