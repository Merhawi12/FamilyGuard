# Local backing services only — Postgres and Redis, matching what the API gets
# from Cloud SQL and Memorystore in Google Cloud.
#
#   docker compose up -d
#   cp services/api/.env.example services/api/.env   # then fill in the secrets
#   npm run dev:api / npm run dev:family / npm run dev:admin
#
# The apps themselves run on the host so hot reload works normally.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parentix
      POSTGRES_USER: parentix
      POSTGRES_PASSWORD: parentix_secret
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parentix']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
