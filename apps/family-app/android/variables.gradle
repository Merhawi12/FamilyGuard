ext {
    minSdkVersion = 22
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'

    // Sign in with Google, through Credential Manager — see GoogleAuthPlugin.
    // `credentials-play-services-auth` is the half that talks to Play Services
    // and is required as well as `credentials`: without it Credential Manager
    // compiles, runs, and finds no provider on any device below Android 14.
    androidxCredentialsVersion = '1.3.0'
    googleIdVersion = '1.1.1'
    playServicesBaseVersion = '18.5.0'
}