# Parentix nginx site config — TLS-terminating reverse proxy.
#
# Prerequisites (see deploy/PRODUCTION_HARDENING.md for the full runbook):
#   1. DNS A records for parentix.ca and www.parentix.ca point at this server.
#   2. Certbot has issued a cert:  sudo certbot certonly --webroot -w /var/www/certbot \
#        -d parentix.ca -d www.parentix.ca
#      (or run `sudo certbot --nginx` to let certbot manage the 443 block for you).
#
# Deploy: copy to /etc/nginx/sites-available/parentix, symlink into sites-enabled,
#         `sudo nginx -t` then `sudo systemctl reload nginx`.

# ── HTTP :80 — ACME challenges + permanent redirect to HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name parentix.ca www.parentix.ca;

    # Let's Encrypt HTTP-01 challenge files are served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is upgraded to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the real site ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parentix.ca www.parentix.ca;

    ssl_certificate     /etc/letsencrypt/live/parentix.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parentix.ca/privkey.pem;

    # Modern, safe TLS defaults (equivalent to certbot's options-ssl-nginx.conf).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — force HTTPS for a year (only enable once you're sure HTTPS is stable).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve React frontend
    root /var/www/parentix;
    index index.html;

    client_max_body_size 10m;

    # API proxy → Node.js backend
    location /api/ {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.io WebSocket proxy
    location /socket.io/ {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # React SPA — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
